<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
 <defs>
  <radialGradient id="glowTeal"><stop offset="0" stop-color="#19C6C3" stop-opacity=".25"/><stop offset=".45" stop-color="#19C6C3" stop-opacity=".09"/><stop offset="1" stop-color="#19C6C3" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowBlue"><stop offset="0" stop-color="#4B8BFF" stop-opacity=".2"/><stop offset=".52" stop-color="#4B8BFF" stop-opacity=".07"/><stop offset="1" stop-color="#4B8BFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="coinFill" cx="35%" cy="28%"><stop offset="0" stop-color="#FFF3C2"/><stop offset=".38" stop-color="#F0D278"/><stop offset="1" stop-color="#B98B32"/></radialGradient>
  <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#19C6C3" stop-opacity="0"/><stop offset=".55" stop-color="#19C6C3" stop-opacity=".45"/><stop offset="1" stop-color="#F0D278" stop-opacity=".72"/></linearGradient>
  <linearGradient id="sheen" x1="-40%" y1="0" x2="-5%" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#7CE8E2" stop-opacity=".24"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/><animate attributeName="x1" values="-40%;120%;-40%" dur="18s" repeatCount="indefinite"/><animate attributeName="x2" values="-5%;155%;-5%" dur="18s" repeatCount="indefinite"/></linearGradient>
  <g id="coin"><circle r="30" fill="url(#coinFill)" fill-opacity=".9" stroke="#FFE8A4" stroke-opacity=".95" stroke-width="2"/><circle r="23" fill="none" stroke="#A97827" stroke-opacity=".7" stroke-width="1.5"/><path d="M0-12 3.4-3.7 12-3.7 5 1.7 7.7 10 0 5-7.7 10-5 1.7-12-3.7-3.4-3.7Z" fill="#FFF5D5" fill-opacity=".88"/></g>
  <g id="star" fill="#D7FBFF"><path d="M0-8 2-2 8 0 2 2 0 8-2 2-8 0-2-2Z"/></g>
 </defs>
 <g aria-hidden="true">
  <!-- soft brand light -->
  <ellipse cx="510" cy="265" rx="330" ry="250" fill="url(#glowTeal)" opacity=".78"><animate attributeName="opacity" values=".62;.92;.62" dur="11s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="1715" cy="360" rx="360" ry="290" fill="url(#glowBlue)" opacity=".76"><animate attributeName="opacity" values=".56;.9;.56" dur="13s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="1540" cy="890" rx="410" ry="270" fill="url(#glowTeal)" opacity=".72"><animate attributeName="opacity" values=".55;.84;.55" dur="15s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="1040" cy="1035" rx="440" ry="150" fill="url(#glowBlue)" opacity=".64"/>
  <!-- restrained glass panels behind the existing hero and navigator -->
  <rect x="250" y="128" width="1595" height="330" rx="28" fill="#0E1B2D" fill-opacity=".38" stroke="#A9F0EC" stroke-opacity=".18" stroke-width="1.4"/>
  <rect x="250" y="128" width="1595" height="330" rx="28" fill="url(#sheen)" opacity=".46"/>
  <path d="M782 183V403" stroke="#A9F0EC" stroke-opacity=".16" stroke-width="1.5"/>
  <path d="M820 407H1110" stroke="#19C6C3" stroke-opacity=".42" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1120" cy="407" r="3.5" fill="#19C6C3" opacity=".9"><animate attributeName="r" values="2.5;4;2.5" dur="3s" repeatCount="indefinite"/></circle>
  <rect x="275" y="530" width="1595" height="218" rx="24" fill="#0E1B2D" fill-opacity=".3" stroke="#A9F0EC" stroke-opacity=".14" stroke-width="1.2"/>
  <path d="M302 531H1850" stroke="#19C6C3" stroke-opacity=".28" stroke-width="1.2"/>
  <!-- rising motion trails for the coin flow -->
  <path d="M1185 445 C1328 389 1472 334 1645 222" fill="none" stroke="url(#trail)" stroke-width="2.2" stroke-dasharray="2 13" stroke-linecap="round" opacity=".64"/>
  <path d="M1525 850 C1640 760 1730 660 1857 503" fill="none" stroke="url(#trail)" stroke-width="2" stroke-dasharray="2 13" stroke-linecap="round" opacity=".42"/>
  <path d="M700 980 C840 900 960 865 1100 820" fill="none" stroke="#19C6C3" stroke-opacity=".22" stroke-width="2" stroke-dasharray="1 12" stroke-linecap="round"/>
  <g transform="translate(1240 448)" opacity=".72"><use xlink:href="#coin"/><animateMotion dur="17s" repeatCount="indefinite" path="M0 0 C145-35 265-100 430-225"/></g>
  <g transform="translate(1585 815) scale(.76)" opacity=".6"><use xlink:href="#coin"/><animateMotion begin="4s" dur="19s" repeatCount="indefinite" path="M0 0 C95-70 185-165 265-315"/></g>
  <g transform="translate(760 940) scale(.58)" opacity=".5"><use xlink:href="#coin"/><animateMotion begin="8s" dur="21s" repeatCount="indefinite" path="M0 0 C105-55 205-80 365-130"/></g>
  <g transform="translate(1700 510) scale(.48)" opacity=".48"><use xlink:href="#coin"/><animateMotion begin="11s" dur="16s" repeatCount="indefinite" path="M0 0 C70-55 115-115 170-205"/></g>
  <!-- subtle stars with varied timing -->
  <g opacity=".74"><use xlink:href="#star" x="236" y="165"><animate attributeName="opacity" values=".32;1;.4;.32" dur="4.8s" repeatCount="indefinite"/></use><use xlink:href="#star" x="755" y="155"><animate attributeName="opacity" values=".35;.8;.25;.35" dur="6.2s" repeatCount="indefinite"/></use><use xlink:href="#star" x="1780" y="160"><animate attributeName="opacity" values=".3;1;.45;.3" dur="5.5s" repeatCount="indefinite"/></use><use xlink:href="#star" x="1860" y="330"><animate attributeName="opacity" values=".5;.9;.3;.5" dur="7s" repeatCount="indefinite"/></use><use xlink:href="#star" x="1690" y="505"><animate attributeName="opacity" values=".28;.85;.35;.28" dur="5.8s" repeatCount="indefinite"/></use><use xlink:href="#star" x="1850" y="750"><animate attributeName="opacity" values=".4;1;.3;.4" dur="6.5s" repeatCount="indefinite"/></use><use xlink:href="#star" x="260" y="870"/><use xlink:href="#star" x="1090" y="930"><animate attributeName="opacity" values=".25;.8;.3;.25" dur="7.4s" repeatCount="indefinite"/></use><use xlink:href="#star" x="1450" y="1000"/><use xlink:href="#star" x="1815" y="970"><animate attributeName="opacity" values=".4;.95;.3;.4" dur="5.3s" repeatCount="indefinite"/></use></g>
  <g fill="#F5F7FA" opacity=".5"><circle cx="315" cy="235" r="2"/><circle cx="815" cy="410" r="1.6"/><circle cx="950" cy="180" r="1.8"/><circle cx="1660" cy="180" r="1.5"/><circle cx="1880" cy="425" r="2"/><circle cx="1730" cy="690" r="1.7"/><circle cx="490" cy="930" r="1.5"/><circle cx="1260" cy="960" r="2"/><circle cx="1620" cy="1020" r="1.5"/></g>
  <g fill="#19C6C3" opacity=".55"><circle cx="1785" cy="235" r="3"/><circle cx="1820" cy="575" r="2.4"/><circle cx="1500" cy="925" r="2.5"/></g>
 </g>
</svg>